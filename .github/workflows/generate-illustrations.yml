name: Generate illustrations

# Triggered manually (workflow_dispatch) or by edits to the prompt catalog /
# the .illust-trigger marker file.
#
# Requires repository secret HF_TOKEN (Hugging Face Read-scope inference
# token). Add at:
#   https://github.com/dh914/Codes/settings/secrets/actions/new

on:
  workflow_dispatch:
    inputs:
      keys:
        description: 'Catalog keys (space-separated) or "all"'
        required: false
        default: 'all'
      model:
        description: 'Optional model override (default: FLUX.1-schnell)'
        required: false
        default: 'black-forest-labs/FLUX.1-schnell'
      provider:
        description: 'HF provider (auto / hf-inference / fal-ai / replicate / together)'
        required: false
        default: 'auto'
  push:
    paths:
      - 'prompts/**'
      - '.github/workflows/generate-illustrations.yml'
      - '.illust-trigger'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[poster]"

      - name: Generate illustrations
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret not set. Add at https://github.com/${{ github.repository }}/settings/secrets/actions/new"
            exit 1
          fi
          KEYS_INPUT="${{ github.event.inputs.keys }}"
          MODEL_INPUT="${{ github.event.inputs.model }}"
          PROVIDER_INPUT="${{ github.event.inputs.provider }}"
          ARGS=()
          if [ -z "$KEYS_INPUT" ] || [ "$KEYS_INPUT" = "all" ]; then
            ARGS+=(--all)
          else
            for k in $KEYS_INPUT; do ARGS+=("$k"); done
          fi
          if [ -n "$MODEL_INPUT" ]; then
            ARGS+=(-m "$MODEL_INPUT")
          else
            ARGS+=(-m "black-forest-labs/FLUX.1-schnell")
          fi
          if [ -n "$PROVIDER_INPUT" ]; then
            ARGS+=(--provider "$PROVIDER_INPUT")
          fi
          python scripts/generate_from_catalog.py "${ARGS[@]}"

      - name: Commit generated PNGs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design/illust_*.png || true
          if git diff --staged --quiet; then
            echo "No new illustrations to commit."
          else
            git commit -m "Generate illustrations [skip ci]

run=${{ github.run_number }}"
            git push
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: illustrations-${{ github.run_number }}
          path: design/illust_*.png
          if-no-files-found: warn
          retention-days: 30
