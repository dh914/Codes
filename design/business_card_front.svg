<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo',sans-serif">
  <defs>
    <style>
      .navy { fill: #1F4E79; }
      .blue { fill: #7BC4E2; }
      .lime { fill: #B8C534; }
      .gray { fill: #6B7280; }
      .navy-stroke { fill: none; stroke: #1F4E79; stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; }
    </style>
  </defs>

  <!-- card background -->
  <rect x="0" y="0" width="900" height="500" rx="18" fill="#FFFFFF"/>
  <rect x="0" y="0" width="900" height="500" rx="18" fill="none" stroke="#E5E7EB" stroke-width="1"/>

  <!-- yellow-green corner accent -->
  <path d="M0,500 L0,420 Q0,500 80,500 Z" fill="#B8C534" opacity="0.85"/>
  <circle cx="60" cy="468" r="6" fill="#7BC4E2"/>

  <!-- LOGO MARK (left side) -->
  <g transform="translate(95,90)">
    <!-- saturn ring (hat) -->
    <ellipse cx="70" cy="22" rx="48" ry="10" class="navy-stroke"/>
    <!-- head -->
    <circle cx="70" cy="28" r="22" fill="#FFFFFF" class="navy-stroke"/>
    <!-- head color fills (sky blue arc) -->
    <path d="M52,22 Q70,8 88,22 Q88,38 70,46 Q52,38 52,22 Z" fill="#7BC4E2" opacity="0.85"/>
    <!-- body: stylized 옷-shape -->
    <path d="M70,52
             L70,80
             L20,150
             Q14,158 22,162
             L52,162
             L70,140
             L88,162
             L118,162
             Q126,158 120,150
             L70,80 Z"
          fill="#FFFFFF" class="navy-stroke"/>
    <!-- inner color blobs -->
    <path d="M70,90 L40,140 L60,150 L70,135 Z" fill="#7BC4E2" opacity="0.9"/>
    <path d="M70,90 L100,140 L80,150 L70,135 Z" fill="#B8C534" opacity="0.9"/>
    <!-- floating dots -->
    <circle cx="20" cy="40" r="7" fill="#B8C534"/>
    <circle cx="125" cy="58" r="8" fill="#7BC4E2"/>
    <circle cx="118" cy="18" r="5" fill="#7BC4E2"/>
    <circle cx="15" cy="118" r="5" fill="#1F4E79"/>
  </g>

  <!-- 청년마을 wordmark -->
  <text x="100" y="320" font-size="44" font-weight="800" class="navy" letter-spacing="-1">청년마을</text>
  <text x="100" y="348" font-size="13" font-weight="500" class="gray" letter-spacing="3">YOUTH VILLAGE</text>

  <!-- divider -->
  <line x1="430" y1="80" x2="430" y2="420" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- RIGHT: person info -->
  <g transform="translate(470,110)">
    <text x="0" y="0" font-size="42" font-weight="800" class="navy" letter-spacing="-1">김 청 년</text>
    <text x="0" y="30" font-size="14" font-weight="500" class="gray">Kim Cheongnyeon  ·  커뮤니티 매니저</text>

    <!-- yellow-green underline -->
    <rect x="0" y="50" width="60" height="4" rx="2" fill="#B8C534"/>

    <!-- contact rows -->
    <g transform="translate(0,90)" font-size="15" font-weight="500">
      <!-- phone -->
      <circle cx="10" cy="10" r="10" class="navy"/>
      <text x="32" y="15" class="navy">M.  010-1234-5678</text>

      <!-- email -->
      <circle cx="10" cy="48" r="10" class="navy"/>
      <text x="32" y="53" class="navy">E.  youth@village.kr</text>

      <!-- web -->
      <circle cx="10" cy="86" r="10" class="navy"/>
      <text x="32" y="91" class="navy">W. www.youthvillage.kr</text>

      <!-- address -->
      <circle cx="10" cy="124" r="10" class="navy"/>
      <text x="32" y="129" class="navy">A.  서울특별시 마포구 청년로 123, 4층</text>
    </g>
  </g>

  <!-- subtle decorative dots -->
  <circle cx="840" cy="60" r="6" fill="#B8C534"/>
  <circle cx="860" cy="80" r="4" fill="#7BC4E2"/>
  <circle cx="820" cy="78" r="3" fill="#1F4E79"/>
</svg>
