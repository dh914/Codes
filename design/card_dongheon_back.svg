<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500"
     font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Nanum Myeongjo',serif">
  <defs>
    <radialGradient id="paperBg2" cx="50%" cy="45%" r="80%">
      <stop offset="0%" stop-color="#FBF3DE"/>
      <stop offset="100%" stop-color="#EEDFBE"/>
    </radialGradient>
    <radialGradient id="washSky" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A8C8D9" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#A8C8D9" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#A8C8D9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="washSunset" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8B96A" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#E8B96A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#E8B96A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillFar2" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#A8B58A"/>
      <stop offset="100%" stop-color="#8C9A6E"/>
    </linearGradient>
    <linearGradient id="hillMid2" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#7E8A60"/>
      <stop offset="100%" stop-color="#5F6B47"/>
    </linearGradient>
    <linearGradient id="hillNear2" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#5F6B47"/>
      <stop offset="100%" stop-color="#3E4A2C"/>
    </linearGradient>
    <linearGradient id="ricePaddyGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#E8C969"/>
      <stop offset="100%" stop-color="#C49A3E"/>
    </linearGradient>
    <filter id="grain2" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.7
                             0 0 0 0 0.6
                             0 0 0 0 0.4
                             0 0 0 0.08 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="watercolor2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="7"/>
    </filter>

    <symbol id="riceStalk2" viewBox="0 0 100 200">
      <path d="M50,200 Q48,140 52,80 Q54,40 50,5" stroke="#7A8B3F" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M50,170 Q20,150 8,120" stroke="#9BAB52" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M50,150 Q80,135 92,108" stroke="#9BAB52" stroke-width="3" fill="none" stroke-linecap="round"/>
      <g fill="#E0A82E">
        <ellipse cx="46" cy="14" rx="4" ry="7" transform="rotate(-12 46 14)"/>
        <ellipse cx="40" cy="26" rx="4" ry="7" transform="rotate(-18 40 26)"/>
        <ellipse cx="56" cy="22" rx="4" ry="7" transform="rotate(12 56 22)"/>
        <ellipse cx="36" cy="40" rx="4" ry="7" transform="rotate(-22 36 40)"/>
        <ellipse cx="60" cy="38" rx="4" ry="7" transform="rotate(18 60 38)"/>
        <ellipse cx="44" cy="52" rx="4" ry="7" transform="rotate(-14 44 52)"/>
        <ellipse cx="58" cy="56" rx="4" ry="7" transform="rotate(14 58 56)"/>
      </g>
      <g fill="#D86B47">
        <ellipse cx="50" cy="8" rx="3.5" ry="6"/>
        <ellipse cx="48" cy="34" rx="3.5" ry="6" transform="rotate(-10 48 34)"/>
      </g>
    </symbol>

    <symbol id="pine2" viewBox="0 0 40 60">
      <path d="M20,2 L10,22 L16,22 L6,40 L14,40 L2,58 L38,58 L26,40 L34,40 L24,22 L30,22 Z"
            fill="#3E4A2C"/>
      <rect x="18" y="56" width="4" height="6" fill="#5A4A2E"/>
    </symbol>

    <symbol id="farmhouse2" viewBox="0 0 80 50">
      <path d="M5,28 Q40,8 75,28 L75,30 L5,30 Z" fill="#8C7050"/>
      <path d="M5,28 Q40,8 75,28" stroke="#5A4A2E" stroke-width="1" fill="none"/>
      <rect x="14" y="30" width="52" height="18" fill="#F1E5C6"/>
      <rect x="14" y="30" width="52" height="18" stroke="#5A4A2E" stroke-width="1" fill="none"/>
      <rect x="36" y="36" width="10" height="12" fill="#5A4A2E"/>
      <rect x="22" y="35" width="8" height="7" fill="#C9B884"/>
      <rect x="52" y="35" width="8" height="7" fill="#C9B884"/>
    </symbol>

    <!-- Persimmon tree -->
    <symbol id="persimmon" viewBox="0 0 70 100">
      <path d="M35,100 L35,55" stroke="#5A4A2E" stroke-width="3"/>
      <ellipse cx="35" cy="40" rx="32" ry="28" fill="#5F6B47" filter="url(#watercolor2)"/>
      <ellipse cx="35" cy="36" rx="26" ry="22" fill="#7E8A60" opacity="0.7"/>
      <g fill="#D86B47">
        <circle cx="22" cy="38" r="4.5"/>
        <circle cx="42" cy="32" r="5"/>
        <circle cx="50" cy="45" r="4"/>
        <circle cx="30" cy="50" r="4"/>
        <circle cx="40" cy="48" r="3.5"/>
      </g>
    </symbol>
  </defs>

  <!-- paper background -->
  <rect x="0" y="0" width="900" height="500" rx="20" fill="url(#paperBg2)"/>

  <!-- watercolor washes -->
  <ellipse cx="450" cy="100" rx="380" ry="140" fill="url(#washSky)" filter="url(#watercolor2)"/>
  <ellipse cx="450" cy="380" rx="420" ry="120" fill="url(#washSunset)" filter="url(#watercolor2)"/>

  <!-- paper grain -->
  <rect x="0" y="0" width="900" height="500" rx="20" fill="#000" filter="url(#grain2)" opacity="0.32"/>

  <!-- ============ TOP LANDSCAPE BAND ============ -->
  <g opacity="0.92">
    <!-- distant misty mountains -->
    <path d="M0,180 Q80,140 160,160 Q240,180 320,150 Q400,120 480,150 Q560,180 640,145 Q720,115 800,150 Q860,175 900,160 L900,210 L0,210 Z"
          fill="url(#hillFar2)" filter="url(#watercolor2)" opacity="0.55"/>
    <!-- mid hills -->
    <path d="M0,200 Q100,180 200,195 Q300,210 420,185 Q540,165 660,190 Q780,210 900,195 L900,235 L0,235 Z"
          fill="url(#hillMid2)" filter="url(#watercolor2)" opacity="0.7"/>
    <!-- pines on hills -->
    <use href="#pine2" x="120" y="170" width="14" height="22"/>
    <use href="#pine2" x="138" y="174" width="12" height="20"/>
    <use href="#pine2" x="750" y="170" width="14" height="22"/>
    <use href="#pine2" x="768" y="176" width="11" height="18"/>
    <!-- persimmon tree on left hill -->
    <use href="#persimmon" x="50" y="140" width="48" height="70"/>
    <!-- farmhouse on mid right -->
    <use href="#farmhouse2" x="600" y="190" width="50" height="30"/>
    <!-- rice paddy stripe -->
    <path d="M0,230 Q200,225 450,232 Q700,238 900,230 L900,255 Q700,260 450,255 Q200,250 0,255 Z"
          fill="url(#ricePaddyGrad)" filter="url(#watercolor2)" opacity="0.7"/>
  </g>

  <!-- 청년마을 LOGO MARK (top center, sitting on landscape) -->
  <g transform="translate(370,38) scale(1.05)">
    <ellipse cx="70" cy="22" rx="48" ry="10" fill="none" stroke="#1F4E79" stroke-width="5"/>
    <circle cx="70" cy="28" r="22" fill="#FBF3DE" stroke="#1F4E79" stroke-width="5"/>
    <path d="M52,22 Q70,8 88,22 Q88,38 70,46 Q52,38 52,22 Z" fill="#7BC4E2" opacity="0.85"/>
    <path d="M70,52 L70,80 L20,150 Q14,158 22,162 L52,162 L70,140 L88,162 L118,162 Q126,158 120,150 L70,80 Z"
          fill="#FBF3DE" stroke="#1F4E79" stroke-width="5" stroke-linejoin="round"/>
    <path d="M70,90 L40,140 L60,150 L70,135 Z" fill="#7BC4E2" opacity="0.9"/>
    <path d="M70,90 L100,140 L80,150 L70,135 Z" fill="#B8C534" opacity="0.9"/>
    <circle cx="20" cy="40" r="6" fill="#B8C534"/>
    <circle cx="125" cy="58" r="7" fill="#7BC4E2"/>
    <circle cx="118" cy="18" r="4" fill="#7BC4E2"/>
  </g>

  <!-- 청년마을 wordmark -->
  <text x="450" y="280" text-anchor="middle" font-size="32" font-weight="800" fill="#1F4E79" letter-spacing="2">청년마을</text>

  <!-- dashed divider -->
  <line x1="220" y1="305" x2="680" y2="305" stroke="#C9B884" stroke-width="1.5" stroke-dasharray="3 6"/>

  <!-- Name + role row -->
  <g transform="translate(450,348)" text-anchor="middle">
    <text x="0" y="0" font-size="40" font-weight="800" fill="#3B4A3E" letter-spacing="8"
          font-family="'Nanum Myeongjo','Noto Serif KR',serif">동 훈</text>
    <g transform="translate(0,28)">
      <circle cx="-92" cy="-5" r="5" fill="#3F8B82"/>
      <text x="0" y="0" font-size="17" font-weight="700" fill="#3B4A3E">연결 활동가</text>
      <text x="80" y="0" font-size="12" font-style="italic" fill="#8C7A4B">/ Connection Activist</text>
    </g>
  </g>

  <!-- handwritten intro -->
  <text x="450" y="418" text-anchor="middle" font-size="16" font-weight="500" fill="#5A4A2E" font-style="italic"
        font-family="'Nanum Pen Script','Gaegu','Noto Serif KR',cursive">
    "청년의 이야기가 이어지는 곳에서, 연결의 실을 잇습니다."
  </text>

  <!-- contact row -->
  <g transform="translate(450,455)" text-anchor="middle" font-size="12.5" font-weight="500" fill="#3B4A3E">
    <g transform="translate(-220,0)">
      <circle cx="-8" cy="-4" r="4" fill="#E58B95"/>
      <text x="0" y="0">010-3248-6230</text>
    </g>
    <g transform="translate(0,0)">
      <circle cx="-100" cy="-4" r="4" fill="#3F8B82"/>
      <text x="0" y="0">dogdoh1338@icloud.com</text>
    </g>
    <g transform="translate(220,0)">
      <circle cx="-50" cy="-4" r="4" fill="#D4A93C"/>
      <text x="0" y="0">@dogdoh1338</text>
    </g>
  </g>

  <!-- bottom corner rice stalks (decorative, after text) -->
  <use href="#riceStalk2" x="20" y="320" width="80" height="180" transform="rotate(170 60 410)" opacity="0.85"/>
  <use href="#riceStalk2" x="800" y="320" width="80" height="180" transform="rotate(190 840 410)" opacity="0.85"/>
</svg>
